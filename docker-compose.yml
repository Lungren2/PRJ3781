name: morrow

services:
  # Crawler service and JSON API. Also the entrypoint for one-off crawls:
  #   docker compose run --rm api npm run crawl
  api:
    # One image for both Node services; the second build is a cache hit.
    image: morrow-dev:local
    build:
      context: .
      target: dev
    command: npm run dev:api
    environment:
      PORT: "8787"
      # Kept off the bind-mounted source tree and on named volumes, so the
      # database and HTTP cache survive rebuilds without landing in the repo.
      MORROW_DB_PATH: /app/server/data/morrow.db
      MORROW_CACHE_DIR: /app/server/.cache/http
      MORROW_CORS_ORIGINS: ${MORROW_CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:8080,http://localhost:8080}
      MORROW_DEMO_AUTH_ENABLED: ${MORROW_DEMO_AUTH_ENABLED:-1}
      MORROW_SESSION_TTL_HOURS: ${MORROW_SESSION_TTL_HOURS:-8}
      MORROW_LOGIN_WINDOW_MINUTES: ${MORROW_LOGIN_WINDOW_MINUTES:-15}
      MORROW_LOGIN_MAX_ATTEMPTS: ${MORROW_LOGIN_MAX_ATTEMPTS:-8}
      ENTRA_ENABLED: ${ENTRA_ENABLED:-0}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      ENTRA_REDIRECT_URI: ${ENTRA_REDIRECT_URI:-}
      ENTRA_TRANSACTION_TTL_MINUTES: ${ENTRA_TRANSACTION_TTL_MINUTES:-10}
      # A daily background crawl is not what anyone wants from a container they
      # started to look at the UI, so it is opt-in here.
      MORROW_CRAWL_SCHEDULE_ENABLED: ${MORROW_CRAWL_SCHEDULE_ENABLED:-0}
      MORROW_USER_AGENT: ${MORROW_USER_AGENT:-}
      MICROSOFT_LEARN_ENABLED: ${MICROSOFT_LEARN_ENABLED:-1}
      COURSERA_ENABLED: ${COURSERA_ENABLED:-1}
      COURSERA_USE_CATALOG_API: ${COURSERA_USE_CATALOG_API:-1}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      # Only the sources are mounted: node_modules stays the image's own copy,
      # because better-sqlite3 is compiled for the container, not the host.
      - ./server/src:/app/server/src
      # `npm run crawl` refreshes the tracked fallback snapshot in place.
      - ./public/data:/app/public/data
      - api-data:/app/server/data
      - api-cache:/app/server/.cache
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Vite dev server with hot reload - http://localhost:5173
  web:
    image: morrow-dev:local
    build:
      context: .
      target: dev
    environment:
      # Consumed by the `/api` proxy in vite.config.js.
      MORROW_API_URL: http://api:8787
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.js:/app/vite.config.js
    depends_on:
      - api

  # Production build served by nginx - http://localhost:8080
  # Opt in with: docker compose --profile preview up --build
  preview:
    profiles: [preview]
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  api-data:
  api-cache:
